@if (store.state(); as state) {
  <div class="form">
    <label>
      Wi-Fi name
      <input
        [disabled]="state.lifecycle !== 'ready' || !!state.active_operation"
        [ngModel]="wifi.draftSsid()"
        (ngModelChange)="wifi.draftSsid.set($event)"
        maxlength="32"
      />
    </label>

    <label>
      Encryption
      <select
        [disabled]="state.lifecycle !== 'ready' || !!state.active_operation"
        [ngModel]="wifi.draftEncryption()"
        (ngModelChange)="wifi.draftEncryption.set($event)"
      >
        <option value="none">None (Open)</option>
        <option value="psk2">WPA2-PSK</option>
        <option value="sae">WPA3-SAE</option>
        <option value="sae-mixed">WPA2/WPA3-Mixed</option>
      </select>
    </label>

    @if (wifi.draftEncryption() !== 'none') {
      <label>
        Password
        <input
          [type]="showPassword() ? 'text' : 'password'"
          [disabled]="state.lifecycle !== 'ready' || !!state.active_operation"
          [ngModel]="wifi.draftKey()"
          (ngModelChange)="wifi.draftKey.set($event)"
          placeholder="8–63 characters"
          minlength="8"
          maxlength="63"
        />
      </label>

      <label class="checkbox-label">
        <input
          type="checkbox"
          [disabled]="state.lifecycle !== 'ready' || !!state.active_operation"
          [ngModel]="showPassword()"
          (ngModelChange)="showPassword.set($event)"
        />
        <span>Show password</span>
      </label>
    }

    <details class="advanced-settings" style="margin-bottom: 1rem;">
      <summary>Advanced Settings</summary>
      <div class="note" style="margin-top: 0.5rem; font-size: 0.9em; color: #6b7280;">
        <p><strong>Channel Selection:</strong> Fast Roaming (802.11r/k/v) and Band Steering are managed automatically.</p>
      </div>
    </details>

    <button type="button" [disabled]="!wifi.canSave()" (click)="save()">
      {{ store.saving() ? 'Applying…' : 'Save Wi-Fi' }}
    </button>
  </div>
}
